# conda env create -f environment.yml
# conda activate ai4good-neophytes
#
# PyTorch is installed via pip so the CUDA build can be pinned; adjust the index
# URL to your driver (cu121 works with driver >= 530) or drop the --extra-index-url
# line for a CPU-only install.
name: ai4good-neophytes
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # geospatial I/O (conda-forge ships GDAL with these, pip wheels are fiddlier)
  - rasterio=1.4.*
  - gdal
  # scientific stack
  - numpy<2.3
  - pandas
  - scikit-learn
  - matplotlib
  - opencv
  - tqdm
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - pytorch-lightning==2.5.2
      - torchmetrics==1.8.0
      - segmentation-models-pytorch==0.5.0
      - timm==1.0.19
      - albumentations==2.0.8
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - wandb==0.21.0      # optional, only needed for logger=wandb
