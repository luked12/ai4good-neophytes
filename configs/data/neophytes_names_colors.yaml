  6: { name: "A. altissima", color: "#dd60f6", stats_name: "A_altissima" }

# Display order for plots: sorted by max plant height (tallest first)
display_order: [6, 2, 1, 3, 4, 5]
  
growth_form_groups:
  Trees:
    classes: ["A. altissima", "R. typhina"]
    color: "#1b9e77"   # Dark2 teal
