crop_size_train: 2048  # will be used later as img_size (therefore defined, even though not used here)

# # Transforms/Augmentations
norm_mean: [0.485, 0.456, 0.406]
norm_std: [0.229, 0.224, 0.225]

train_transforms:
  - type: Normalize
    params:
      mean: ${data.norm_mean}
      std: ${data.norm_std}

val_transforms:
  - type: Normalize
    params:
      mean: ${data.norm_mean}
      std: ${data.norm_std}

test_transforms:
  - type: Normalize
    params:
      mean: ${data.norm_mean}
      std: ${data.norm_std}

# # for DSM & DTM      
dsm_transforms:
  - type: Resize
    params:
      height: 2048
      width: 2048
      interpolation: 1
      p: 1.0
  - type: Normalize
    params:
      mean: 450
      std: 50
      max_pixel_value: 1.0

# # for nDSM (= DSM - DTM, vegetation/object height)
ndsm_transforms:
  - type: Resize
    params:
      height: 2048
      width: 2048
      interpolation: 1
      p: 1.0
  - type: Normalize
    params:
      mean: 1.43
      std: 3.10
      max_pixel_value: 1.0

transforms_additional_targets:
  canopy: mask
  phenology: mask
  dsm: float_mask
  dtm: float_mask
  ndsm: float_mask
