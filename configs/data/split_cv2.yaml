  test:
  # Test = the TRAIN patches of the held-out sites (train and test are swapped inside
  # those sites, so their /test patches stay free for experiments that need a few
  # labelled examples from the target site). Testing on the larger area gives ~3.5x the
  # tiles and foreground of the /test-only definition, which is what makes the per-class
  # scores stable enough to compare across methods.

    - '../data/Neophytes/2024/Aarau_2_1/train'
