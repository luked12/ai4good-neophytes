# Random split inside every site: train/val/test tiles come from the same
# orthophotos. Easier than the CV folds (no unseen site), a good first run.
defaults:
  - data
  - neophytes_names_colors
  - split_local
  - transforms_1024

data_name: 'np_loc'
batch_size_train: 8
batch_size_val: 2
batch_size_test: 2
num_workers: 8
